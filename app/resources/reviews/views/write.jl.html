<!-- Write Review Page -->
<!-- @SOURCE: movies_gui_app/src/sgbdrennequinepolis/DialogWriteVote.java::public DialogWriteVote::} -->
<h1>Write a Review for <%= movie.title %></h1>

<div class="error" id="errorMsg" style="display:none;"></div>
<div class="success" id="successMsg" style="display:none;"></div>

<form id="reviewForm" onsubmit="submitReview(event)">
    <div class="form-group">
        <label for="login">Your Login (username):</label>
        <input type="text" id="login" name="login" required>
    </div>

    <div class="form-group">
        <label for="rating">Rating (0-10):</label>
        <input type="number" id="rating" name="rating" min="0" max="10" required>
        <small>0 = Terrible, 10 = Masterpiece</small>
    </div>

    <div class="form-group">
        <label for="review">Review (optional, max 200 characters):</label>
        <textarea id="review" name="review" maxlength="200" rows="4"
                  placeholder="Share your thoughts about this movie..."></textarea>
        <small id="charCount">0/200 characters</small>
    </div>

    <button type="submit">Submit Review</button>
    <button type="button" class="btn-secondary" onclick="window.location.href='/movies/<%= movie.id_movie %>'">
        Cancel
    </button>
</form>

<div class="nav-links">
    <a href="/movies/<%= movie.id_movie %>">Back to Movie Details</a>
    <a href="/">Back to Search</a>
</div>

<script>
// Character counter
document.getElementById('review').addEventListener('input', function() {
    const charCount = this.value.length;
    document.getElementById('charCount').textContent = `${charCount}/200 characters`;
});

// Submit review
async function submitReview(event) {
    event.preventDefault();

    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    try {
        const formData = new FormData(event.target);
        formData.append('movie_id', '<%= movie.id_movie %>');

        const response = await fetch('/api/movies/<%= movie.id_movie %>/reviews', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (data.success) {
            successMsg.textContent = 'Review submitted successfully!';
            successMsg.style.display = 'block';

            // Redirect to movie details after 2 seconds
            setTimeout(() => {
                window.location.href = '/movies/<%= movie.id_movie %>';
            }, 2000);
        } else {
            errorMsg.textContent = data.error || 'Failed to submit review';
            errorMsg.style.display = 'block';
        }
    } catch (error) {
        errorMsg.textContent = 'An error occurred: ' + error.message;
        errorMsg.style.display = 'block';
    }
}
</script>
